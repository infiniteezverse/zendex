<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZENDEX</title>
  <link rel="icon" type="image/jpeg" href="logo.jpg" />
  <link rel="apple-touch-icon" href="logo.jpg" />
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --gold: #c9a84c;
      --gold-light: #e8c97a;
      --white: #f5f5f5;
      --black: #000000;
    }

    html, body {
      height: 100%;
      background: var(--black);
      color: var(--white);
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* subtle gold ambient glow */
    body::before {
      content: '';
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(201, 168, 76, 0.06) 0%, transparent 70%);
      animation: breathe 6s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.12); }
    }

    @keyframes shimmer {
      0% { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }

    /* thin gold line top */
    .line-top {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, var(--gold) 40%, var(--gold-light) 60%, transparent 100%);
      opacity: 0.5;
    }

    .line-bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, var(--gold) 40%, var(--gold-light) 60%, transparent 100%);
      opacity: 0.5;
    }

    /* corner accents */
    .corner {
      position: fixed;
      width: 32px;
      height: 32px;
      opacity: 0.3;
    }
    .corner-tl { top: 18px; left: 18px; border-top: 1px solid var(--gold-light); border-left: 1px solid var(--gold-light); }
    .corner-tr { top: 18px; right: 18px; border-top: 1px solid var(--gold-light); border-right: 1px solid var(--gold-light); }
    .corner-bl { bottom: 18px; left: 18px; border-bottom: 1px solid var(--gold-light); border-left: 1px solid var(--gold-light); }
    .corner-br { bottom: 18px; right: 18px; border-bottom: 1px solid var(--gold-light); border-right: 1px solid var(--gold-light); }

    .container {
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .logo {
      width: 200px;
      margin: 0 auto 1.6rem;
    }

    .logo img {
      width: 100%;
      height: auto;
      display: block;
      mix-blend-mode: lighten;
      filter: contrast(1.1);
    }

    .wordmark {
      font-size: clamp(3rem, 8vw, 6rem);
      font-weight: 700;
      letter-spacing: 0.18em;
      line-height: 1;
      margin-bottom: 1.2rem;
      background: linear-gradient(
        105deg,
        var(--white) 0%,
        var(--white) 38%,
        var(--gold-light) 48%,
        var(--white) 58%,
        var(--white) 100%
      );
      background-size: 400px 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 6s ease-in-out infinite;
    }

    .tagline {
      font-size: clamp(0.75rem, 1.8vw, 1rem);
      font-weight: 300;
      letter-spacing: 0.45em;
      text-transform: uppercase;
      color: rgba(201, 168, 76, 0.4);
      margin-bottom: 4rem;
    }

    .divider {
      width: 60px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 0 auto 4rem;
      opacity: 0.7;
    }

    .buttons {
      display: flex;
      gap: 1.2rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 0.75rem 2.2rem;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      text-decoration: none;
      border: 1px solid rgba(201, 168, 76, 0.3);
      color: rgba(201, 168, 76, 0.6);
      background: transparent;
      transition: border-color 0.4s, color 0.4s, box-shadow 0.4s;
      cursor: pointer;
    }

    .btn:hover {
      border-color: var(--gold-light);
      color: var(--gold-light);
      box-shadow: 0 0 18px rgba(201, 168, 76, 0.12);
    }
  </style>
</head>
<body>
  <div class="line-top"></div>
  <div class="line-bottom"></div>
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <div class="container">
    <div class="logo">
      <img src="logo.jpg" alt="ZENDEX" />
    </div>
    <div class="wordmark">ZENDEX</div>
    <div class="tagline">Privacy &nbsp;&middot;&nbsp; Security &nbsp;&middot;&nbsp; ZEN</div>
    <div class="divider"></div>
    <div class="buttons">
      <a class="btn" href="https://x.com/zendexfi" target="_blank" rel="noopener">Socials</a>
      <a class="btn" href="https://forms.gle/KSHnJcftVEfGp3uZA" target="_blank" rel="noopener">Inquiry</a>
    </div>
  </div>
</body>
</html>
